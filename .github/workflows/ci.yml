# SPDX-License-Identifier: GPL-3.0-or-later
# Revenant CI: the quality gates from AGENTS.md, enforced on every push and PR.
# Build/test/coverage/fuzz jobs activate once source lands in M0; the lint and
# guard jobs run from the foundation commit onward.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only need to read the repository. Any job that needs
# more requests it explicitly at the job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_COMMIT: 84bab45d415d22042bd0b9081aea57f362da3f35 # 2025.12.12
  # Three jobs install it — the one that runs the duplication gate and the two
  # that run its unit tests under ctest — and a partial bump would leave the
  # gate enforcing on one version while its tests pin another.
  LIZARD_VERSION: 1.23.0
  # clang-format and clang-tidy move together and are pinned to the local dev
  # toolchain: check behaviour and formatting both differ across majors, so a
  # gate that took whatever a runner image shipped would flap. Named once here
  # because three jobs now install one or the other, and two copies of a pin
  # drift.
  CLANG_TOOLS_VERSION: 22.1.8

jobs:
  guards:
    name: Lint & guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The ADR gate diffs a range, and the default depth-1 clone cannot
          # diff anything at all — it would fail as a broken range rather than
          # report on the change (story-0705). The two jobs that run `ctest`
          # need it for the same reason, because `LintUnitTests` drives the gate
          # against a real historical commit.
          fetch-depth: 0
      - name: Install lint tooling
        # clang-format is version-pinned via the PyPI wheel to match the local
        # dev toolchain exactly — apt's distro version formats a handful of
        # constructs differently, which makes format-check flap across
        # environments (observed on the first M0 push: apt 18 vs local 22).
        # `lizard` is pinned for the same reason and one more: the duplication
        # gate reads a block's token length off the extension's own node
        # indices, which is version-specific in a way an API version number
        # would not announce. It is installed into the interpreter that runs
        # the gate rather than through pipx, because the gate imports it.
        run: |
          sudo apt-get update && sudo apt-get install -y python3
          pipx install clang-format==${{ env.CLANG_TOOLS_VERSION }}
          python3 -m pip install --break-system-packages lizard==${{ env.LIZARD_VERSION }}
      - name: Configure a directory for the gate targets
        # The gates are CMake targets, and a target needs a configured build
        # directory — but not a resolved one. The only `find_package` in the tree
        # is GTest, reached only when `REVENANT_BUILD_TESTS` is ON, so with it off
        # this needs no vcpkg, no ninja and no dependency: a compiler probe and a
        # glob. Measured at 4.5s. `revenant_add_dev_targets()` runs
        # unconditionally and its roots are fixed, so turning tests off does not
        # shrink what the format gate covers.
        run: cmake -S . -B build/gates -DREVENANT_BUILD_TESTS=OFF
      - name: Structural guards (file length, layer DAG)
        # The target, not a copy of its command line. The two agreed by hand
        # until now; nothing held them there, and a gate CI reimplements is a
        # gate developers do not actually run. The target carries both guards
        # the compiler has no check for, so the step names both rather than
        # the one it started as.
        run: cmake --build build/gates --target guard-limits
      - name: Formatting check
        run: cmake --build build/gates --target format-check
      - name: Duplication detector (DRY)
        run: python3 tools/lint/check_duplication.py --min-tokens 60 src include tools
      # Cheap, and it runs in the guards job so the answer arrives before any
      # compiler starts: clang is the only toolchain here that rejects a stray
      # cp1252 byte, so without this the mistake costs a whole build matrix.
      - name: Source encoding (plain UTF-8)
        run: python3 tools/lint/check_encoding.py src include tests tools
      # story-0705: an Accepted ADR is superseded by a new record, not edited in
      # place. Pull requests only, because the range is the thing being judged:
      # a push to `main` has already merged, and re-judging it would report a
      # breach nobody can now act on without a revert.
      - name: ADR immutability
        # Three dots: see the gate-14 section of docs/testing/quality-gates.md,
        # which owns the reasoning. Restating it here is how it came to be
        # stated three times, wrongly, in two of the three.
        if: github.event_name == 'pull_request'
        run: >
          python3 tools/lint/check_adr_immutability.py
          "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

  build-test:
    name: Build & test (${{ matrix.os }})
    needs: guards
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # `LintUnitTests` asserts the ADR gate fails on the real commit it was
          # written for (`4a4221e`), so ctest needs history here too. The default
          # depth-1 clone makes that assertion fail as a broken range — a gate
          # test that cannot reach the commit it names proves nothing (story-0705).
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.13'
      - name: Install the pinned clang-format
        # Before Configure, not after: `find_program` resolves clang-format once,
        # at configure time, and a clang-format installed afterwards is one the
        # targets do not know about — they would simply not exist. Same PyPI
        # wheel and same pin as the `guards` job, for the same reason.
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install clang-format==${{ env.CLANG_TOOLS_VERSION }}
      - uses: ./.github/actions/setup-vcpkg
      - uses: lukka/get-cmake@b516803a3c5fac40e2e922349d15cdebdba01e60 # v3.30.5
      - name: Install the duplication detector
        # `ctest` runs the gate scripts' own unit tests (`LintUnitTests`), and
        # the duplication gate's units import `lizard`. Every job that runs
        # ctest therefore needs it, not only the one that runs the gate.
        shell: bash
        run: python3 -m pip install --break-system-packages lizard==${{ env.LIZARD_VERSION }}
      - name: Skip if no sources yet
        id: probe
        shell: bash
        run: |
          if [ -f src/CMakeLists.txt ]; then echo "have_src=true" >> "$GITHUB_OUTPUT";
          else echo "have_src=false" >> "$GITHUB_OUTPUT"; echo "No sources yet — skipping build."; fi
      - name: Configure
        if: steps.probe.outputs.have_src == 'true'
        shell: bash
        # Windows ships its own LLVM, whose clang-format version follows the
        # image rather than our pin, and PATH order between that and a pip
        # Scripts directory is not a thing to bet a merge gate on. `find_program`
        # honours a cache entry that is already set, so the Windows leg names the
        # binary it just installed. Linux takes the same clang-format the
        # `guards` job does, from PATH.
        run: |
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Resolved once, then both printed and passed: printing a
            # clang-format the gate is not the one the gate runs proves nothing.
            binary=$(command -v clang-format)
            "$binary" --version
            extra+=("-DREVENANT_CLANG_FORMAT=$binary")
          fi
          cmake --preset debug "${extra[@]}"
      # The literal targets a contributor runs, on the platform where they were
      # dead for a milestone. They need a configured build directory and nothing
      # compiled in it, so they run before the build rather than queueing behind
      # the slowest leg in the matrix. `build-test` needs `guards`, so the same
      # two verdicts on the same files already passed on Linux before this job
      # starts: anything failing here is a mechanism failure, which is what
      # these steps exist to surface.
      #
      # One step each, named for the gate, matching the `guards` job — so a red
      # run says which gate failed. And one command each, under `bash`: two
      # native commands in one `pwsh` step propagate a non-zero exit only
      # according to `$PSNativeCommandUseErrorActionPreference`, which is a
      # property of the runner image rather than of this repository. A gate
      # whose failure might not stop the step is the exact thing this story is
      # about.
      - name: Formatting check (Windows)
        if: runner.os == 'Windows' && steps.probe.outputs.have_src == 'true'
        shell: bash
        run: cmake --build --preset debug --target format-check
      - name: Structural guards (Windows)
        if: runner.os == 'Windows' && steps.probe.outputs.have_src == 'true'
        shell: bash
        run: cmake --build --preset debug --target guard-limits
      - name: Build
        if: steps.probe.outputs.have_src == 'true'
        run: cmake --build --preset debug
      - name: Test (ASan + UBSan)
        if: steps.probe.outputs.have_src == 'true'
        run: ctest --preset debug --output-on-failure

  tidy:
    # Sharded because clang-tidy is the longest gate by a wide margin: it visits
    # every file in the tree, and a runner's four cores are the ceiling on how
    # fast one job can get through them. Each shard configures its own build and
    # takes every fourth file, so the set checked is exactly the same — only the
    # number of machines doing it changes. Raise `shard` and `REVENANT_TIDY_SHARDS`
    # together or files go unchecked.
    # `part N of 4`, one-based, because the bare `0/4` a zero-based index
    # produces reads as a progress count rather than as which slice this job is.
    # The label is carried alongside the index rather than computed from it:
    # Actions expressions have no arithmetic.
    name: Code Tidiness (part ${{ matrix.part }} of 4)
    needs: guards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, part: 1 }
          - { shard: 1, part: 2 }
          - { shard: 2, part: 3 }
          - { shard: 3, part: 4 }
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Probe for sources
        id: probe
        run: |
          if [ -f src/CMakeLists.txt ]; then echo "have_src=true" >> "$GITHUB_OUTPUT";
          else echo "have_src=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install tooling
        if: steps.probe.outputs.have_src == 'true'
        # clang-tidy is version-pinned via the PyPI wheel to match the local
        # dev toolchain — check behavior differs across clang-tidy
        # majors, and the gate must not depend on which distro version apt
        # happens to ship. Plain clang (compiler for the compile DB) may be
        # the distro version; only the analyzer binary is pinned.
        run: |
          sudo apt-get update && sudo apt-get install -y clang ninja-build
          pipx install clang-tidy==${{ env.CLANG_TOOLS_VERSION }}
      - uses: ./.github/actions/setup-vcpkg
        if: steps.probe.outputs.have_src == 'true'
      - name: Configure & run clang-tidy
        if: steps.probe.outputs.have_src == 'true'
        run: |
          cmake --preset debug -DREVENANT_TIDY_SHARDS=4 -DREVENANT_TIDY_SHARD=${{ matrix.shard }}
          cmake --build --preset debug --target tidy

  coverage:
    # Depends on `guards`, not on `build-test`: this job checks out and builds
    # the tree from scratch with its own instrumented preset and takes nothing
    # from the build jobs. Waiting for them — and in particular for the Windows
    # leg, which is the slowest and has nothing to do with a coverage number
    # measured on Linux — only pushed the run's finish line back.
    name: Coverage (>= 85%)
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # `LintUnitTests` asserts the ADR gate fails on the real commit it was
          # written for (`4a4221e`), so ctest needs history here too. The default
          # depth-1 clone makes that assertion fail as a broken range — a gate
          # test that cannot reach the commit it names proves nothing (story-0705).
          fetch-depth: 0
      - name: Install tooling
        # `lizard` for the same reason as in `build-test`: this job runs ctest,
        # and ctest runs the duplication gate's own unit tests.
        run: |
          sudo apt-get update && sudo apt-get install -y clang llvm ninja-build python3
          python3 -m pip install --break-system-packages lizard==${{ env.LIZARD_VERSION }}
      - uses: ./.github/actions/setup-vcpkg
      - name: Build and test with coverage instrumentation
        env:
          CC: clang
          CXX: clang++
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/coverage/raw/%p.profraw
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          ctest --preset coverage --output-on-failure
      - name: Enforce the 85% core floor
        run: |
          llvm-profdata merge -sparse build/coverage/raw/*.profraw -o build/coverage/tests.profdata
          llvm-cov export -summary-only -instr-profile build/coverage/tests.profdata \
            build/coverage/tests/revenant_tests > build/coverage/coverage.json
          python3 tools/lint/check_coverage.py --min 85 \
            --export build/coverage/coverage.json --root "$GITHUB_WORKSPACE" \
            --prefix src --prefix include

  build-release:
    # The optimized builds. Exactly one of them publishes the artifact the
    # benchmarks and M7's packaging consume, so those two milestones still add
    # one *artifact* build between them; the second leg publishes nothing and
    # exists only to be compiled. That is the point an earlier version of this
    # comment got backwards. An optimized build's second product is the
    # compiler's opinion, and the debug legs cannot supply it: `-O2` is what
    # makes `-Wnull-dereference` and `-Warray-bounds` see anything, and both
    # found a real latent bug here the first time this job existed (0.3.0's
    # `Fixed` entries). Tests are ON, from the preset and not overridden — with
    # them off, no test translation unit was compiled at `-O2 -Werror` anywhere
    # in CI, which is a third of the tree exempt from the warning contract.
    name: Release build (${{ matrix.label }})
    needs: guards
    runs-on: ubuntu-latest
    strategy:
      # As in the other matrices here: a failure on one leg must not cancel the
      # leg that publishes the artifact.
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            label: artifact
            artifact: true
          - cc: clang
            cxx: clang++
            label: clang optimized
            artifact: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install clang
        # Taken from apt rather than from whatever the runner image ships, the
        # same way the tidy job takes its compiler. Only this leg needs it; gcc
        # is the image's default toolchain.
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - uses: ./.github/actions/setup-vcpkg
      - uses: lukka/get-cmake@b516803a3c5fac40e2e922349d15cdebdba01e60 # v3.30.5
      - name: Configure & build
        # No `-DREVENANT_BUILD_TESTS=OFF`. The preset declares tests ON and this
        # job used to declare them off, which is one configuration with two
        # answers — and the answer that shipped was the weaker one.
        #
        # The compiler is chosen here rather than on the job, following the
        # `coverage` job: `setup-vcpkg` then bootstraps and builds gtest with the
        # image's default toolchain on both legs, so the two legs share a vcpkg
        # cache and only this tree is compiled twice.
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          ${{ matrix.cxx }} --version
          cmake --preset release
          cmake --build --preset release
      - name: Prove the tests were compiled
        # A compile gate that compiles nothing passes. That is precisely how the
        # override above went unnoticed for a milestone, so the job asserts its
        # own product instead of trusting an exit code — the same refusal to pass
        # vacuously as the tidy shard-index check and the format gate's empty-set
        # rule. It is also what stops the override quietly coming back.
        run: test -x build/release/tests/revenant_tests
      - name: Stage the binaries and what built them
        if: matrix.artifact
        # `build-info.json` travels with them: a harness that cannot tell an
        # optimized build from a debug one would happily report a debug one's
        # numbers, and they look exactly like real ones.
        run: |
          mkdir -p dist
          cp build/release/src/revenant-carve build/release/src/revenant-undelete dist/
          cp build/release/tools/imagegen/revenant-imagegen dist/
          cp build/release/build-info.json dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.artifact
        with:
          name: release-binaries
          path: dist/
          retention-days: 14

  benchmarks:
    # Installs no compiler, no vcpkg and no CMake. It downloads the binaries
    # the job above built, generates its fixtures with one of them, and drives
    # the other two. valgrind is the only thing it adds, for the instruction
    # count — the metric that survives being measured on a different machine.
    name: Benchmarks
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to fetch main's published run as the baseline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Run the suite
        run: |
          chmod +x dist/revenant-*
          python3 tools/perf/run_benchmarks.py --build-dir dist --json benchmarks.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: benchmarks.json
          retention-days: 30
      # No baseline lives in the repository: an absolute measurement captured
      # on one machine means nothing on another. What CI compares against is
      # `main`'s own published run, on the same runner class — and until main
      # has one, there is nothing to compare and that is said out loud rather
      # than passed over.
      - name: Fetch main's published run
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId') || run_id=""
          if [ -n "$run_id" ] && gh run download "$run_id" --name benchmarks --dir baseline; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No published benchmark run on main yet; this run becomes the first."
          fi
      - name: Compare against main
        if: steps.baseline.outputs.found == 'true'
        run: |
          python3 tools/perf/compare_baseline.py \
            --baseline baseline/benchmarks.json --current benchmarks.json

  fuzz-smoke:
    # Likewise independent of `build-test`: its own preset, its own from-scratch
    # clang + libFuzzer build.
    name: Fuzz smoke (short run)
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Probe for fuzz targets
        id: probe
        run: |
          if [ -f tests/fuzz/CMakeLists.txt ]; then
            echo "have_fuzz=true" >> "$GITHUB_OUTPUT";
          else echo "have_fuzz=false" >> "$GITHUB_OUTPUT"; echo "No fuzz targets yet."; fi
      - uses: ./.github/actions/setup-vcpkg
        if: steps.probe.outputs.have_fuzz == 'true'
      - name: Build & run fuzzers briefly
        if: steps.probe.outputs.have_fuzz == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y clang ninja-build
          cmake --preset fuzz
          cmake --build --preset fuzz
          # A fuzz build whose library carries no coverage instrumentation runs,
          # exits zero, and finds almost nothing — the twenty seconds below would
          # go on passing while measuring the harness only (story-0606).
          python3 tools/lint/check_fuzz_instrumentation.py build/fuzz/src/librevenant.a
          # One target after another cost twenty seconds *each*, which grew with
          # every format and filesystem added. They are independent processes, so
          # they run together instead; each still gets its own twenty seconds of
          # wall clock against its own corpus. `xargs` exits 123 if any of them
          # exits non-zero, which is what fails the gate.
          printf '%s\n' build/fuzz/tests/fuzz/*Fuzz |
            xargs -P "$(nproc)" -I{} sh -c \
              '"$1" -max_total_time=20 -rss_limit_mb=512 tests/fuzz/corpus/"$(basename "$1")"' _ {}
